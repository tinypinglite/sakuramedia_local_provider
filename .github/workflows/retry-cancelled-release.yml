name: Retry cancelled release publishes

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: retry-cancelled-release
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Rerun release workflows whose publish job was cancelled
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ids=$(gh run list --workflow release-plugin.yml --limit 30 \
            --json databaseId,conclusion \
            --jq '.[] | select(.conclusion == "cancelled") | .databaseId')
          if [ -z "$ids" ]; then
            echo "no cancelled release runs"
            exit 0
          fi
          for id in $ids; do
            cancelled=$(gh run view "$id" --json jobs \
              --jq '[.jobs[] | select(.conclusion == "cancelled") | .name] | join(",")')
            if [ "$cancelled" != "publish" ]; then
              echo "skip $id: cancelled jobs are [$cancelled]"
              continue
            fi
            echo "retrying cancelled publish in run $id"
            gh run rerun "$id" --failed || true
          done
